<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f5f78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Casco Calculator</title>
<meta name="apple-mobile-web-app-title" content="Casco Calculator">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de móvil; menú de 3 botones grandes -> pantalla de pregunta con datos arriba y respuesta grande abajo */
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --fg: #16202a;
  --muted: #5b6875;
  --line: #cfd6dc;
  --accent: #0f5f78;
  --accent-fg: #ffffff;
  --answer-bg: #16202a;
  --answer-fg: #f4f7f9;
  --warn: #9a5b00;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #18222b; --fg: #e8eef2; --muted: #9aa8b4; --line: #2c3a46;
    --accent: #3fa7c6; --accent-fg: #071419; --answer-bg: #e8eef2; --answer-fg: #0f151b; --warn: #e0a243;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #18222b; --fg: #e8eef2; --muted: #9aa8b4; --line: #2c3a46;
  --accent: #3fa7c6; --accent-fg: #071419; --answer-bg: #e8eef2; --answer-fg: #0f151b; --warn: #e0a243;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header .eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1, h2 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.05; }
h1 { font-size: 34px; }
h2 { font-size: 30px; }
.menu { display: flex; flex-direction: column; gap: 12px; }
.q {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  background: var(--surface); color: var(--fg); border: 2px solid var(--line); border-radius: 14px;
  padding: 18px 16px; font: 600 21px/1.2 var(--display); letter-spacing: .01em; cursor: pointer;
}
.q:hover, .q:focus-visible { border-color: var(--accent); outline: none; }
.q .ic { flex: none; width: 44px; height: 44px; border-radius: 10px; background: var(--accent); color: var(--accent-fg);
  display: grid; place-items: center; font: 700 22px var(--display); }
.q .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.q .desc { font: 500 14px/1.3 var(--body); color: var(--muted); }
.back { align-self: flex-start; background: none; border: 0; color: var(--accent); font: 600 17px var(--body); padding: 6px 0; cursor: pointer; }
.back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
form { display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 15px; }
.field small { color: var(--muted); font-size: 13px; }
.field input {
  font: 600 22px var(--body); font-variant-numeric: tabular-nums; padding: 12px; border-radius: 10px;
  border: 2px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; min-width: 0;
}
.field input:focus { border-color: var(--accent); outline: none; }
.calc { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 12px; padding: 16px; font: 700 22px var(--display); letter-spacing: .03em; text-transform: uppercase; cursor: pointer; }
.calc:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.answer { background: var(--answer-bg); color: var(--answer-fg); border-radius: 16px; padding: 22px 18px; display: flex; flex-direction: column; gap: 6px; min-height: 150px; justify-content: center; }
.answer .lbl { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; font-weight: 600; }
.answer .big { white-space: pre-line; font: 700 64px/1 var(--display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.answer .sub { font-size: 15px; opacity: .85; }
.tabla { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.tabla h3 { margin: 0; font: 700 20px var(--display); }
.tabla table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tabla th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.tabla td { padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 18px; }
.tabla td:last-child, .tabla th:last-child { text-align: right; }
.tabla tr:last-child td { border-bottom: 0; }
.tabla tr.yo td { font-weight: 700; color: var(--accent); }
.datos { font-size: 13px; color: var(--muted); }
.note { font-size: 13px; color: var(--warn); border-left: 3px solid var(--warn); padding-left: 10px; }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Casco Calculator</div>
    <h1 id="title">Elige un apartado</h1>
  </header>

  <!-- MENÚ (apartados o preguntas de un apartado; se rellena desde APARTADOS) -->
  <section id="menu" class="menu">
    <button class="back" id="backMenu" hidden>← Apartados</button>
    <div id="lista" class="menu"></div>
  </section>

  <!-- PANTALLA DE PREGUNTA -->
  <section id="screen" class="wrap" hidden>
    <button class="back" id="back">← Volver</button>
    <form id="form" novalidate></form>
    <div class="answer" aria-live="polite">
      <span class="lbl" id="ansLbl">Respuesta</span>
      <span class="big" id="ansBig">—</span>
      <span class="sub" id="ansSub">Rellena los datos y pulsa Calcular.</span>
    </div>
    <div id="extra"></div>
    <p class="note" id="nota">Fórmula provisional de ejemplo. Los datos y el cálculo definitivos se añadirán cuando los pases.</p>
  </section>
</div>

<script>
/* =====================================================================
   PREGUNTAS
   Cada pregunta tiene: título, lista de datos (campos) y una función
   calcular(d) que recibe los valores y devuelve { big, sub }.
   >>> AQUÍ SE CAMBIARÁN LOS CAMPOS Y LAS FÓRMULAS REALES <<<
   ===================================================================== */
function ahoraHHMM() { const n = new Date(); return pad(n.getHours()) + ":" + pad(n.getMinutes()); }
function pad(n) { return String(n).padStart(2, "0"); }
function aMin(hhmm) { const [h, m] = (hhmm || "0:0").split(":").map(Number); return h * 60 + m; }
function aHora(min) { min = Math.round(min); const d = Math.floor(min / 1440); min = ((min % 1440) + 1440) % 1440;
  return pad(Math.floor(min / 60)) + ":" + pad(min % 60) + (d > 0 ? " (+" + d + " día)" : ""); }
const fmt = (n, dec = 0) => n.toLocaleString("es-ES", { maximumFractionDigits: dec });
function dur(min) { min = Math.round(min); const h = Math.floor(min / 60), m = min % 60;
  return (h ? h + " h " : "") + (m || !h ? m + " min" : "").trim(); }

// Datos fijos de la mesa
const KG_POR_CAJA = 18;        // peso medio de una caja de contramuslo con hueso
const RENDIMIENTO = 0.66;      // carne que queda al quitar el hueso
const KG_PERSONA_HORA = 50;    // kg de carne que hace una persona en una hora

const PREGUNTAS = {
  hora: {
    titulo: "¿A qué hora vamos a acabar?",
    etiqueta: "Acabamos a las",
    definitiva: true,
    campos: [
      { id: "horaActual", label: "Hora actual", type: "time", value: ahoraHHMM },
      { id: "cajas", label: "Cajas de contramuslo que quedan", value: 100 },
      { id: "personas", label: "Personas en la mesa", value: 8 },
    ],
    // Y = cajas × 18 × 0,66 (kg de carne)  ·  horas = Y / (personas × 50)  ·  fin = hora actual + horas
    calcular(d) {
      if (!(d.cajas >= 0) || !(d.personas > 0)) return { big: "—", sub: "Pon el número de cajas y de personas." };
      const Y = d.cajas * KG_POR_CAJA * RENDIMIENTO;
      const inicio = aMin(d.horaActual);
      const minPara = (p) => Y / (p * KG_PERSONA_HORA) * 60;
      const min = minPara(d.personas);
      const desde = Math.max(1, d.personas - 3), hasta = d.personas + 4;
      let filas = "";
      for (let p = desde; p <= hasta; p++) {
        const m = minPara(p);
        filas += '<tr' + (p === d.personas ? ' class="yo"' : '') + '><td>' + p + (p === d.personas ? ' (ahora)' : '') +
          '</td><td>' + dur(m) + '</td><td>' + aHora(inicio + m) + '</td></tr>';
      }
      return {
        big: aHora(inicio + min),
        sub: "Quedan " + fmt(Y) + " kg de carne. Con " + d.personas + " personas tardamos " + dur(min) + ".",
        extra: '<div class="tabla"><h3>Con otro número de personas</h3><table><thead><tr><th>Personas</th><th>Tiempo</th><th>Acaban a las</th></tr></thead><tbody>' +
          filas + '</tbody></table><p class="datos">' + fmt(d.cajas) + ' cajas × ' + KG_POR_CAJA + ' kg × ' + fmt(RENDIMIENTO, 2) +
          ' = ' + fmt(Y) + ' kg de carne. Cada persona hace ' + KG_PERSONA_HORA + ' kg/h.</p></div>',
      };
    },
  },
  personas: {
    titulo: "¿Cuántas personas necesito para acabar a una hora?",
    etiqueta: "Personas necesarias",
    definitiva: true,
    campos: [
      { id: "horaActual", label: "Hora actual", type: "time", value: ahoraHHMM },
      { id: "horaObjetivo", label: "Hora a la que quieres acabar", type: "time", value: "14:00" },
      { id: "cajas", label: "Cajas de contramuslo que quedan", value: 100 },
    ],
    // kg = cajas × 18 × 0,66  ·  personas = kg / (50 × horas disponibles), sin redondear
    calcular(d) {
      let disp = aMin(d.horaObjetivo) - aMin(d.horaActual);
      if (disp <= 0) disp += 1440;
      if (!(d.cajas > 0)) return { big: "—", sub: "Pon el número de cajas." };
      d.kgCarne = d.cajas * KG_POR_CAJA * RENDIMIENTO;
      const exacto = d.kgCarne / (KG_PERSONA_HORA * disp / 60);
      const n = Math.max(1, Math.ceil(exacto));
      const inicio = aMin(d.horaActual);
      const minPara = (p) => d.kgCarne / (p * KG_PERSONA_HORA) * 60;
      let filas = "";
      for (let p = Math.max(1, n - 2); p <= n + 2; p++) {
        const m = minPara(p), llega = m <= disp + 0.5;
        filas += '<tr' + (p === n ? ' class="yo"' : '') + '><td>' + p + '</td><td>' + aHora(inicio + m) +
          '</td><td>' + (llega ? 'Sí' : 'No') + '</td></tr>';
      }
      return {
        big: fmt(exacto, 2) + (exacto === 1 ? " persona" : " personas"),
        sub: "Tienes " + dur(disp) + " (" + fmt(disp / 60, 2) + " h) para hacer " + fmt(d.kgCarne, 2) + " kg de carne. Con " + n + " personas acabáis a las " + aHora(inicio + minPara(n)) + ".",
        extra: '<div class="tabla"><h3>Con otro número de personas</h3><table><thead><tr><th>Personas</th><th>Acaban a las</th><th>Llegan a las ' +
          d.horaObjetivo + '</th></tr></thead><tbody>' + filas + '</tbody></table><p class="datos">' + fmt(d.cajas) + ' cajas × ' + KG_POR_CAJA + ' kg × ' +
          fmt(RENDIMIENTO, 2) + ' = ' + fmt(d.kgCarne, 2) + ' kg. ' + fmt(d.kgCarne, 2) + ' kg ÷ (' + KG_PERSONA_HORA + ' kg/h × ' + fmt(disp / 60, 2) + ' h) = ' + fmt(exacto, 2) + ' personas.</p></div>',
      };
    },
  },
  sobrante: {
    titulo: "¿Cuánto va a quedar para el siguiente turno?",
    etiqueta: "Queda para el siguiente turno",
    definitiva: true,
    campos: [
      { id: "horaActual", label: "Hora actual", type: "time", value: ahoraHHMM },
      { id: "horaCierre", label: "Hora a la que acaba el turno", type: "time", value: "23:30" },
      { id: "cajas", label: "Cajas de contramuslo que quedan", value: 100 },
      { id: "personas", label: "Personas en la mesa", value: 8 },
    ],
    // carne total = cajas × 18 × 0,66  ·  hecha = personas × 50 × horas hasta fin de turno  ·  queda = total − hecha
    calcular(d) {
      if (!(d.cajas >= 0) || !(d.personas > 0)) return { big: "—", sub: "Pon las cajas y las personas." };
      let disp = aMin(d.horaCierre) - aMin(d.horaActual);
      if (disp < 0) disp = 0;
      const kgCaja = KG_POR_CAJA * RENDIMIENTO;
      const total = d.cajas * kgCaja;
      const hecha = d.personas * KG_PERSONA_HORA * disp / 60;
      const queda = Math.max(0, total - hecha);
      const cajasQueda = queda / kgCaja;
      const datos = '<div class="tabla"><h3>Cómo sale</h3><p class="datos">' + fmt(d.cajas, 2) + ' cajas × ' + KG_POR_CAJA + ' kg = ' +
        fmt(d.cajas * KG_POR_CAJA, 2) + ' kg con hueso × ' + fmt(RENDIMIENTO, 2) + ' = ' + fmt(total, 2) + ' kg de carne.<br>' +
        d.personas + ' personas × ' + KG_PERSONA_HORA + ' kg/h × ' + fmt(disp / 60, 2) + ' h (' + dur(disp) + ') = ' + fmt(hecha, 2) +
        ' kg hechos antes del fin de turno.<br>' + fmt(total, 2) + ' − ' + fmt(hecha, 2) + ' = ' + fmt(total - hecha, 2) + ' kg.</p></div>';
      if (queda === 0) {
        const fin = aMin(d.horaActual) + total / (d.personas * KG_PERSONA_HORA) * 60;
        return { big: "0 cajas\n0 kg", sub: "No queda nada: acabáis a las " + aHora(fin) + ", antes del fin de turno.", extra: datos };
      }
      return {
        big: fmt(cajasQueda, 2) + " cajas\n" + fmt(queda, 2) + " kg",
        sub: "Quedan " + fmt(queda, 2) + " kg de carne, que son " + fmt(cajasQueda, 2) + " cajas (" + fmt(cajasQueda * KG_POR_CAJA, 2) + " kg con hueso).",
        extra: datos,
      };
    },
  },
};

/* =====================================================================
   APARTADOS (zonas de la fábrica)
   Para añadir una zona: añade sus preguntas a PREGUNTAS y un apartado aquí
   con la lista de claves de sus preguntas, en el orden en que se verán.
   ===================================================================== */
const APARTADOS = [
  { id: "carne", nombre: "Carne", desc: "Mesa de deshuesado de contramuslo", preguntas: ["hora", "personas", "sobrante"] },
];

/* ===================== Pantallas (no hace falta tocar) ===================== */
const $ = (id) => document.getElementById(id);
let actual = null;
const apartadoDe = (clave) => APARTADOS.find((a) => a.preguntas.includes(clave));
const boton = (go, ic, texto, desc) => '<button class="q" data-go="' + go + '"><span class="ic">' + ic + '</span><span class="txt">' +
  texto + (desc ? '<span class="desc">' + desc + '</span>' : '') + '</span></button>';

function mostrar(clave) {
  const p = PREGUNTAS[clave];
  const ap = p ? apartadoDe(clave) : APARTADOS.find((a) => a.id === clave);
  actual = p ? clave : null;
  $("menu").hidden = !!p;
  $("screen").hidden = !p;
  $("eyebrow").textContent = ap ? ap.nombre + " · " + ap.desc : "Casco Calculator";
  if (!p) {
    $("backMenu").hidden = !ap;
    $("title").textContent = ap ? "¿Qué quieres saber?" : "Elige un apartado";
    $("lista").innerHTML = ap
      ? ap.preguntas.map((k, i) => boton(k, i + 1, PREGUNTAS[k].titulo)).join("")
      : APARTADOS.map((a) => boton(a.id, a.nombre[0], a.nombre, a.desc + " · " + a.preguntas.length + " preguntas")).join("");
    return;
  }
  $("title").textContent = p.titulo;
  $("back").textContent = "← " + ap.nombre;
  $("back").dataset.go = ap.id;
  $("form").innerHTML = p.campos.map((c) => {
    const v = typeof c.value === "function" ? c.value() : c.value;
    return '<div class="field"><label for="' + clave + '-' + c.id + '">' + c.label + '</label>' +
      '<input id="' + clave + '-' + c.id + '" name="' + c.id + '" type="' + (c.type || "number") + '"' +
      (c.type ? "" : ' inputmode="decimal" step="any" min="0"') + ' value="' + v + '">' +
      (c.hint ? "<small>" + c.hint + "</small>" : "") + "</div>";
  }).join("") + '<button class="calc" type="submit">Calcular</button>';
  $("ansLbl").textContent = p.etiqueta;
  $("nota").hidden = !!p.definitiva;
  calcular();
  window.scrollTo(0, 0);
}

function calcular() {
  const p = PREGUNTAS[actual]; if (!p) return;
  const d = {};
  p.campos.forEach((c) => {
    const raw = $("form").elements[c.id].value;
    d[c.id] = c.type === "time" ? raw : parseFloat(String(raw).replace(",", "."));
    if (c.id === "personas") d[c.id] = Math.round(d[c.id]);
  });
  const r = p.calcular(d);
  $("ansBig").textContent = r.big;
  $("ansSub").textContent = r.sub;
  $("extra").innerHTML = r.extra || "";
}

$("lista").addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) location.hash = b.dataset.go; });
$("back").addEventListener("click", () => { location.hash = $("back").dataset.go; });
$("backMenu").addEventListener("click", () => { location.hash = ""; mostrar(""); });
$("form").addEventListener("submit", (e) => { e.preventDefault(); calcular(); });
$("form").addEventListener("input", calcular);
window.addEventListener("hashchange", () => mostrar(location.hash.slice(1)));
mostrar(location.hash.slice(1));
</script>

<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
